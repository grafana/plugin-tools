name: E2E tests
on:
  pull_request:
    paths:
      - 'packages/plugin-e2e/**'
      - '.github/workflows/playwright.yml'

permissions:
  contents: read

jobs:
  resolve-versions:
    name: Resolve Grafana images
    runs-on: ubuntu-x64
    timeout-minutes: 3
    outputs:
      matrix: ${{ steps.resolve-versions.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Resolve Grafana E2E versions
        id: resolve-versions
        uses: grafana/plugin-actions/e2e-version@304ed38a05911eda030608b10ff9ca59616e465c # e2e-version/v3.0.1
        with:
          version-resolver-type: plugin-grafana-dependency
          grafana-dependency: '>=8.5.0'
          skip-grafana-dev-image: false
          # limit: 0 # Uncomment to test all versions since 8.5.0. Useful when testing compatibility for new APIs.

  playwright-tests:
    needs: resolve-versions
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        GRAFANA_IMAGE: ${{fromJson(needs.resolve-versions.outputs.matrix)}}
    permissions:
      id-token: write
    name: ${{ matrix.GRAFANA_IMAGE.name }}@${{ matrix.GRAFANA_IMAGE.VERSION }}
    runs-on: ubuntu-x64
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build --w @grafana/plugin-e2e

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      # Fork PRs never get an OIDC id-token, so Vault secrets are unavailable there.
      # Skipping the Docker Hub login falls back to anonymous image pulls (rate-limit risk only).
      - name: Get secrets for DockerHub login
        id: get-secrets
        if: ${{ github.event.pull_request.head.repo.fork != true }}
        uses: grafana/shared-workflows/actions/get-vault-secrets@9f37f656e063f0ad0b0bfc38d49894b57d363936 # v1.2.1
        with:
          common_secrets: |
            DOCKERHUB_USERNAME=dockerhub:username
            DOCKERHUB_PASSWORD=dockerhub:password
          export_env: false

      - name: Log in to Docker Hub
        if: ${{ github.event.pull_request.head.repo.fork != true }}
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: ${{ fromJSON(steps.get-secrets.outputs.secrets || '{}').DOCKERHUB_USERNAME }}
          password: ${{ fromJSON(steps.get-secrets.outputs.secrets || '{}').DOCKERHUB_PASSWORD }}

      - name: Start Grafana
        working-directory: ./packages/plugin-e2e
        run: |
          ANONYMOUS_AUTH_ENABLED=false GRAFANA_IMAGE=${{ matrix.GRAFANA_IMAGE.NAME }} GRAFANA_VERSION=${{ matrix.GRAFANA_IMAGE.VERSION }} docker compose up -d

      - name: Wait for grafana server
        uses: grafana/plugin-actions/wait-for-grafana@686ff644d420875e6eeb7b4c10d52d634feeacee # wait-for-grafana/v1.0.4
        with:
          url: http://localhost:3000/login

      - name: Run Playwright tests
        id: run-tests
        run: npm run playwright:test --w @grafana/plugin-e2e

      - name: Upload report artifacts
        uses: grafana/plugin-ci-workflows/actions/plugins/playwright-reports/upload-report-artifacts@fa3c4c2356b64475bdcdee63d7e2111abea0c39f # PR grafana/plugin-ci-workflows#819 (GCS reports) - TEMP, do not merge
        if: ${{ always() && !cancelled() }}
        with:
          test-outcome: ${{ steps.run-tests.outcome }}
          report-dir: packages/plugin-e2e/playwright-report
          grafana-image: ${{ matrix.GRAFANA_IMAGE.NAME }}
          grafana-version: ${{ matrix.GRAFANA_IMAGE.VERSION }}

  publish-report:
    if: ${{ always() && !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) }}
    needs: [playwright-tests]
    runs-on: ubuntu-x64
    permissions:
      id-token: write
      pull-requests: write
      contents: read
    steps:
      - name: Publish report
        uses: grafana/plugin-ci-workflows/actions/plugins/playwright-reports/publish-report@fa3c4c2356b64475bdcdee63d7e2111abea0c39f # PR grafana/plugin-ci-workflows#819 (GCS reports) - TEMP, do not merge
        with:
          bucket: dev-grafana-e2e-test-artifacts
          service-account: github-e2e-test-artifacts@grafanalabs-workload-identity.iam.gserviceaccount.com
