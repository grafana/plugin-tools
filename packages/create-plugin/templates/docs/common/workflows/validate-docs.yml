name: Validate documentation

on:
  push:
    branches:
      - main
      - master
    paths:
      - '{{docsPath}}/**'
      - 'src/plugin.json'
      - 'package.json'
{{#if lockFile}}
      - '{{lockFile}}'
{{/if}}
  pull_request:
    branches:
      - main
      - master
    paths:
      - '{{docsPath}}/**'
      - 'src/plugin.json'
      - 'package.json'
{{#if lockFile}}
      - '{{lockFile}}'
{{/if}}

jobs:
  validate:
    name: Validate plugin docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
{{#if_eq packageManagerName "pnpm"}}
      # pnpm action uses the packageManager field in package.json to
      # understand which version to install.
      - uses: pnpm/action-setup@v6
{{/if_eq}}
      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: '{{packageManagerName}}'

      - name: Install dependencies
        run: {{packageManagerInstallCmd}}

      - name: Validate plugin documentation
        run: {{packageManagerName}} run docs:validate
