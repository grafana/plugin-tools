name: Validate documentation

on:
  push:
    branches:
      - main
      - master
    paths:
      - '{{docsPath}}/**'
      - 'src/plugin.json'
  pull_request:
    branches:
      - main
      - master
    paths:
      - '{{docsPath}}/**'
      - 'src/plugin.json'

jobs:
  validate:
    name: Validate plugin docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
{{pnpmSetup}}
      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: '{{packageManagerName}}'

      - name: Install dependencies
        run: {{packageManagerInstallCmd}}

      - name: Validate plugin documentation
        run: |
          DOCS_PATH=$(jq -r '.docsPath // empty' src/plugin.json)
          if [ -z "$DOCS_PATH" ]; then
            echo "docsPath not set in src/plugin.json, skipping"
            exit 0
          fi

          # Scaffolded pages carry <!-- section-brief --> notes explaining what to write, and
          # validation reports each one as an error. That is the local to-do list, not a CI failure -
          # docs still being written should not turn the build red. Once every brief is filled in or
          # deleted, this step starts enforcing. Publishing is gated separately by plugin-validator.
          REMAINING=$(grep -rl 'section-brief:start' "$DOCS_PATH" 2>/dev/null | wc -l | tr -d ' ')
          if [ "$REMAINING" != "0" ]; then
            echo "$REMAINING page(s) still contain scaffolded section-brief notes - docs are still being written, skipping."
            echo "Run \`{{packageManagerName}} run docs:validate\` locally to see what is left."
            exit 0
          fi

          {{packageManagerName}} run docs:validate
